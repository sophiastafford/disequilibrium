name: Build archive

# Rebuilds the issue pages, the archive list and feed.xml from source.
# Publishing an issue is one commit: add issues/YYYY-MM-DD.md. This does the rest.
on:
  push:
    branches: [main]
    paths:
      - 'issues/**'
      - 'issues.json'
      - 'templates/**'
      - 'scripts/**'
      - '.github/workflows/build-archive.yml'
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: write      # required so the job can commit the regenerated files

concurrency:
  group: build-archive
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No install step — the build has no dependencies.
      - name: Regenerate site
        run: node scripts/build-archive.mjs

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Nothing to commit — site already current."
            exit 0
          fi
          git config user.name  "disequilibrium-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A archive.html feed.xml 'issue-*.html'
          git commit -m "Rebuild site from issue sources [skip ci]"
          git push
