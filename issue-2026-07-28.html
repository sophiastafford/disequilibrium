  .kicker{display:inline-flex;align-items:center;gap:10px;font-size:0.78rem;font-weight:700;letter-spacing:0.13em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;}

  .head h1{font-weight:500;font-size:clamp(2rem,4.6vw,2.9rem);letter-spacing:-0.025em;line-height:1.05;margin:0;}

  /* Reader */
  .reader{max-width:var(--maxw);margin:0 auto;padding:0 26px 10px;}
  .reader .frame{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 16px 40px -22px rgba(23,22,28,0.18);}
  .reader iframe{display:block;width:100%;height:84vh;min-height:560px;border:0;}
  .reader .open{display:flex;justify-content:flex-end;margin-top:12px;}
  .reader .open a{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:0.88rem;font-weight:500;transition:color .15s;}
  .reader .open a:hover{color:var(--accent);}

  .sub{margin:34px auto 70px;max-width:var(--maxw);background:var(--ink);color:#fff;border-radius:20px;padding:44px 34px;text-align:center;position:relative;overflow:hidden;}
  .sub::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% -30%,rgba(120,118,255,.35),transparent 62%);}
  .sub h2{position:relative;font-family:'Fraunces',serif;font-weight:500;font-size:clamp(1.5rem,3.4vw,2rem);letter-spacing:-0.02em;margin:0 0 14px;}
  .sub p{position:relative;color:#c7c6d6;margin:0 auto 24px;max-width:440px;}
  .sub .btn{position:relative;background:#fff;color:var(--ink);}
  .sub .btn:hover{background:#eeecff;}

  footer{border-top:1px solid var(--line);padding:40px 0;background:var(--paper-2);}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:0.9rem;max-width:var(--maxw);margin:0 auto;padding:0 26px;}

  .sub{width:auto;}
  @media(max-width:860px){ .sub{margin-left:26px;margin-right:26px;} }
